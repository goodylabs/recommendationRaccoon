services:
  app:
    build: .
    command: sleep infinity
    volumes:
      - .:/app:cached
      - /app/node_modules
      - /app/build
    ports:
      - 8080:8080
      - 9229:9229
    environment:
      PORT: 8080
      RACCOON_REDIS_URL: redis
      RACCOON_REDIS_AUTH: secret

    depends_on:
      - redis

  redis:
    image: redis
    command: redis-server --requirepass secret
